<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareCloud Patient Registration</title>
  <style>
    :root { color-scheme: light; --navy:#17324d; --blue:#2878b5; --mist:#edf5f9; --line:#d8e3e9; --text:#203040; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--text); background:#f6f9fb; }
    header { background:linear-gradient(135deg,var(--navy),#245d7c); color:white; padding:32px max(24px,5vw); }
    header h1 { margin:0 0 6px; font-size:clamp(24px,4vw,38px); }
    header p { margin:0; opacity:.82; }
    main { max-width:1200px; margin:0 auto; padding:28px 24px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    input,button { border:1px solid var(--line); border-radius:9px; padding:11px 13px; font:inherit; }
    input { min-width:220px; background:white; }
    button { background:var(--blue); color:white; border-color:var(--blue); cursor:pointer; font-weight:650; }
    .summary { display:flex; gap:14px; margin-bottom:18px; }
    .card { background:white; border:1px solid var(--line); border-radius:12px; padding:16px 20px; box-shadow:0 5px 18px rgba(25,60,85,.05); }
    .count { font-size:30px; font-weight:750; color:var(--navy); }
    .table-wrap { overflow:auto; background:white; border:1px solid var(--line); border-radius:12px; }
    table { border-collapse:collapse; width:100%; min-width:900px; }
    th,td { text-align:left; padding:13px 15px; border-bottom:1px solid var(--line); }
    th { background:var(--mist); color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
    tbody tr:hover { background:#f8fbfc; }
    .empty,.error { padding:28px; text-align:center; color:#607080; }
    .error { color:#a33; }
    footer { margin-top:18px; color:#71808e; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>Patient Registration</h1>
    <p>Voice-agent registrations, persisted and available through the REST API.</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="lastName" aria-label="Filter by last name" placeholder="Filter by last name">
      <input id="phone" aria-label="Filter by phone number" placeholder="Filter by phone number">
      <button id="search">Search</button>
      <button id="clear">Clear</button>
    </div>
    <div class="summary"><div class="card"><div class="count" id="count">-</div><div>Active patients</div></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Date of birth</th><th>Sex</th><th>Phone</th><th>Address</th><th>Created</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading patients...</td></tr></tbody>
      </table>
    </div>
    <footer>Technical assessment demo. Do not enter real protected health information.</footer>
  </main>
  <script>
    const rows = document.querySelector('#rows');
    const count = document.querySelector('#count');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const phone = value => value ? `(${value.slice(0,3)}) ${value.slice(3,6)}-${value.slice(6)}` : '';
    async function load() {
      const query = new URLSearchParams();
      if (lastName.value.trim()) query.set('last_name', lastName.value.trim());
      if (document.querySelector('#phone').value.trim()) query.set('phone_number', document.querySelector('#phone').value.trim());
      rows.innerHTML = '<tr><td colspan="6" class="empty">Loading patients...</td></tr>';
      try {
        const response = await fetch(`/patients?${query}`);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || 'Could not load patients');
        count.textContent = body.data.length;
        rows.innerHTML = body.data.length ? body.data.map(p => `<tr>
          <td><strong>${esc(p.first_name)} ${esc(p.last_name)}</strong></td>
          <td>${esc(p.date_of_birth)}</td><td>${esc(p.sex)}</td><td>${esc(phone(p.phone_number))}</td>
          <td>${esc([p.address_line_1,p.address_line_2,p.city,p.state,p.zip_code].filter(Boolean).join(', '))}</td>
          <td>${esc(new Date(p.created_at).toLocaleString())}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No patients found.</td></tr>';
      } catch (error) { count.textContent = '-'; rows.innerHTML = `<tr><td colspan="6" class="error">${esc(error.message)}</td></tr>`; }
    }
    document.querySelector('#search').addEventListener('click', load);
    document.querySelector('#clear').addEventListener('click', () => { lastName.value=''; document.querySelector('#phone').value=''; load(); });
    load();
  </script>
</body>
</html>
